# 每 30 分鐘列出社群成員在各專案的 open PR，發佈到 GitHub Pages。
# merged / reviews 是 30 天視窗，每 2 小時才重抓一次，其餘時候沿用線上的版本，省 GraphQL 額度
# （GITHUB_TOKEN 每小時 1,000 點；每次 run 的用量印在 log 的 "rate limit:" 那行）。
# 一次性設定：repo Settings -> Pages -> Source 選 "GitHub Actions"。
#   https://opensource4you.github.io/clip/             open PRs
#   https://opensource4you.github.io/clip/merged.html  最近 30 天 merged
#   https://opensource4you.github.io/clip/reviews.html 最近 30 天 review 過別人的 PR

name: community-prs

on:
  schedule:
    - cron: "17,47 * * * *"   # UTC；避開整點，整點的排程最常被 GitHub 延遲或丟掉
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - github/community_prs.py
      - github/people_all.json
      - .github/workflows/community-prs.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: community-prs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # runner 內建 gh，只需要這個
    defaults:
      run:
        working-directory: github
    steps:
      - uses: actions/checkout@v7

      - name: Build pages
        env:
          SITE: https://opensource4you.github.io/clip
          FULL_EVERY_MIN: 110     # merged / reviews 多久重抓一次
        run: |
          mkdir -p site
          SINCE="$(date -u -d '30 days ago' +%F)"
          NAV=(--nav "open=index.html" --nav "merged 30d=merged.html" --nav "reviews 30d=reviews.html")
          python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
            --out site/index.html

          # 排程觸發時，若線上的 merged / reviews 還夠新就直接沿用；
          # 手動、push，或線上版本抓不到 / 太舊時才重抓。用時間戳而不是看幾點，排程被丟掉也不會漏。
          FULL=1
          if [ "${{ github.event_name }}" = "schedule" ] \
             && curl -fsSL --max-time 30 "$SITE/full-build.txt" -o site/full-build.txt \
             && curl -fsSL --max-time 30 "$SITE/merged.html" -o site/merged.html \
             && curl -fsSL --max-time 30 "$SITE/reviews.html" -o site/reviews.html; then
            LAST="$(tr -cd '0-9' < site/full-build.txt)"
            AGE=$(( ( $(date +%s) - ${LAST:-0} ) / 60 ))
            if [ "$AGE" -lt "$FULL_EVERY_MIN" ]; then
              FULL=0
              echo "merged / reviews built $AGE min ago, reusing the published pages"
            fi
          fi
          if [ "$FULL" = 1 ]; then
            python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
              --state merged --since "$SINCE" \
              --out site/merged.html
            python3 community_prs.py --people-file people_all.json --no-cache "${NAV[@]}" \
              --role reviewer --state any --since "$SINCE" \
              --out site/reviews.html
            date +%s > site/full-build.txt
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: github/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5