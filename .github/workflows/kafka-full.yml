# 完整跑一次 Kafka 的 JUnit 測試，失敗的測試會重跑（跟官方 CI 一樣用 Gradle 的 test-retry）。
# 只跑在社群 VM 上：GitHub 的機器只有 4 核，整個 suite 要跑好幾個小時。
# 跟 kafka-loop 的差別：loop 是同一組測試跑很多次量失敗率；full 是全部跑一次，分出「真的失敗」和「重跑才過的 flaky」。
# 整個 job 吃滿一台機器，靠 Gradle 的 maxParallelForks 平行，所以排在只有一個 runner 的 kafka-full 機器上。
# 觸發：Actions -> kafka-full -> Run workflow（只有對 clip 有 write 權限的人能按）。
# Runner 設定見 .github/self-hosted-runner.md

name: kafka-full
run-name: "full ${{ inputs.account }}/${{ inputs.revision }} ${{ inputs.suite }}${{ inputs.flaky && ' flaky' || '' }} retry=${{ inputs.retries }} (${{ inputs.jdk }})"

on:
  workflow_dispatch:
    inputs:
      account:
        description: GitHub 帳號或組織（例如 apache 或你的帳號）
        default: apache
      revision:
        description: 分支、tag 或 commit SHA
        default: trunk
      suite:
        description: 要跑哪一塊（all 是整個 test；其他選項在舊分支可能有模組不存在）
        type: choice
        options: [all, core, clients, streams, connect, server, tools]
        default: all
      retries:
        description: 失敗的測試最多重跑幾次（官方 CI 用 1）
        type: choice
        options: ["0", "1", "2", "3"]
        default: "1"
      jdk:
        description: eclipse-temurin 映像檔 tag
        type: choice
        options: [17-jdk-jammy, 21-jdk-jammy, 25-jdk-jammy]
        default: 17-jdk-jammy
      flaky:
        description: 只跑標了 @Flaky 的測試（官方 CI 的 flaky job）；不勾就跟一般 ./gradlew test 一樣跳過它們
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  full:
    runs-on: [self-hosted, linux, kafka-full]
    timeout-minutes: 600
    env:
      ACCOUNT: ${{ inputs.account }}
      REVISION: ${{ inputs.revision }}
      SUITE: ${{ inputs.suite }}
      RETRIES: ${{ inputs.retries }}
      FLAKY: ${{ inputs.flaky }}
      IMAGE: docker.io/library/eclipse-temurin:${{ inputs.jdk }}
      GRADLE_CACHE_DIR: ${{ github.workspace }}/../.gradle-cache/full-${{ inputs.jdk }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: clip
          sparse-checkout: kafka

      - name: Validate inputs
        run: |
          [[ "$ACCOUNT" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::bad account"; exit 1; }
          [[ "$REVISION" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad revision"; exit 1; }
          case "$SUITE" in
            all)     tasks="test" ;;
            core)    tasks="core:test" ;;
            clients) tasks="clients:test clients:clients-integration-tests:test" ;;
            streams) tasks="streams:test streams:integration-tests:test streams:streams-scala:test streams:test-utils:test" ;;
            connect) tasks="connect:runtime:test connect:mirror:test connect:mirror-client:test connect:transforms:test connect:json:test connect:file:test connect:basic-auth-extension:test" ;;
            server)  tasks="metadata:test raft:test storage:test server:test server-common:test group-coordinator:test share-coordinator:test transaction-coordinator:test coordinator-common:test" ;;
            tools)   tasks="tools:test shell:test trogdor:test" ;;
            *) echo "::error::未知的 suite：$SUITE"; exit 1 ;;
          esac
          bash clip/kafka/check_gradle_command.sh "./gradlew $tasks"
          echo "TASKS=$tasks" >> "$GITHUB_ENV"
          echo "runner: $RUNNER_NAME"

      - name: Fetch kafka
        run: |
          rm -rf kafka out && mkdir -p kafka out
          cd kafka
          git init -q
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 \
            "https://github.com/${ACCOUNT}/kafka" "+${REVISION}:tmp"
          git switch -q tmp
          git log -1 --format='%H %s'
          # 分支之後會往前走，summary 要記下這次實際測的是哪個 commit
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_SUBJECT=$(git log -1 --format=%s)" >> "$GITHUB_ENV"
          # Kafka 的 repo 沒附 gradle-wrapper.jar，gradlew 會用 curl 下載；
          # 但有些 eclipse-temurin 映像檔（例如 25-jdk-jammy）沒有 curl，所以先在 host 上抓好
          jar=gradle/wrapper/gradle-wrapper.jar
          if [ ! -e "$jar" ]; then
            url=$(grep -oE 'https://[^"[:space:]]+/gradle-wrapper\.jar' gradlew | head -1 || true)
            if [ -n "$url" ]; then curl -fsSL --retry 3 -o "$jar" "$url"; fi
          fi

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -uo pipefail
          # 每個測試 fork 最多 3G heap（core），再留 8G 給 Gradle daemon、編譯和系統
          mem_gb=$(free -g | awk '/^Mem:/{print $2}')
          forks=$(( (mem_gb - 8) / 3 ))
          (( forks > $(nproc) )) && forks=$(nproc)
          (( forks < 1 )) && forks=1
          echo "cpu $(nproc), mem ${mem_gb}G -> maxParallelForks=$forks"
          export FORKS=$forks
          # Kafka 預設會跳過 @Flaky 的測試；帶這個屬性則改成「只跑」@Flaky 的測試
          EXTRA=""
          [[ "$FLAKY" == "true" ]] && EXTRA="-Pkafka.test.run.flaky=true"
          export EXTRA
          mkdir -p "$GRADLE_CACHE_DIR"
          podman pull -q "$IMAGE"
          # job 被取消時 runner 只殺掉 podman 這個 client，container 會繼續跑、一直佔著 Gradle cache 的鎖，
          # 下一次就會 "Timeout waiting to lock journal cache"。所以 container 取固定名字，跑之前先清掉上次留下的
          # 每個 runner 一次只跑一個 job，用 runner 名稱當 container 名字，清掉的只會是這個 runner 自己留下的
          CONTAINER="kafka-full-$(printf '%s' "$RUNNER_NAME" | tr -c 'A-Za-z0-9_.-' '-')"
          echo "CONTAINER=$CONTAINER" >> "$GITHUB_ENV"
          podman rm -f "$CONTAINER" >/dev/null 2>&1 || true
          # 舊版 workflow 留下的 container 沒有名字，用「掛了同一個 Gradle cache」來找
          bash clip/kafka/remove_cache_containers.sh podman "$GRADLE_CACHE_DIR"
          # podman 預設每個容器最多 2048 個 process/thread，Gradle 加上多個測試 fork 會超過，
          # 出現 pthread_create failed (EAGAIN)，所以把上限拿掉（跟 kafka/test_kafka.sh 一樣）
          # 用一般使用者跑，不要用 root：root 可以無視檔案權限，會讓改權限再看會不會失敗的測試誤判。
          # --userns=keep-id 讓容器裡的使用者跟 host 上的 runner 同一個 uid，掛進去的目錄才寫得了。
          podman run --rm --name "$CONTAINER" --pids-limit=-1 --ulimit nproc=16384:16384 --ulimit nofile=65536:65536 \
            --userns=keep-id -e HOME=/tmp -e GRADLE_USER_HOME=/gradle-home \
            -e TASKS -e RETRIES -e FORKS -e EXTRA \
            -v "$PWD/kafka:/tmp/kafka:z" \
            -v "$GRADLE_CACHE_DIR:/gradle-home:z" \
            "$IMAGE" \
            bash -c 'set -f; read -ra tasks <<< "$TASKS"; read -ra extra <<< "$EXTRA"; cd /tmp/kafka && chmod +x ./gradlew && \
              ./gradlew --continue \
                -PmaxParallelForks="$FORKS" \
                -PmaxTestRetries="$RETRIES" -PmaxTestRetryFailures=10 \
                -x spotbugsMain -x spotbugsTest \
                "${extra[@]}" "${tasks[@]}"' 2>&1 | tee out/gradle.log

      - name: Stop container
        if: always()
        run: |
          [ -z "${CONTAINER:-}" ] || podman rm -f "$CONTAINER" >/dev/null 2>&1 || true
          bash clip/kafka/remove_cache_containers.sh podman "$GRADLE_CACHE_DIR"

      - name: Summary
        if: always()
        run: |
          {
            echo "## kafka-full: \`${ACCOUNT}/${REVISION}\`"
            echo "- repo: [${ACCOUNT}/kafka](https://github.com/${ACCOUNT}/kafka)、revision: \`${REVISION}\`"
            echo "- commit: [\`${COMMIT:0:12}\`](https://github.com/${ACCOUNT}/kafka/commit/${COMMIT}) ${COMMIT_SUBJECT}"
            echo "- suite: ${SUITE}（\`${TASKS}\`）、retries: ${RETRIES}、jdk: \`${IMAGE##*:}\`"
            [[ "$FLAKY" == "true" ]] && echo "- 只跑 \`@Flaky\` 的測試（\`-Pkafka.test.run.flaky=true\`）"
            echo "- result: **${{ steps.tests.outcome }}**"
            python3 clip/kafka/junit_failures.py kafka --summary
            # Gradle 失敗但不是測試失敗（checkstyle、編譯、測試 JVM 掛掉…）時，XML 裡看不到原因，從 log 撈出來
            if [ -f out/gradle.log ] && grep -q '^\* What went wrong:' out/gradle.log; then
              echo "### Gradle 錯誤"
              echo '```'
              awk '/^\* What went wrong:/{p=1} /^\* Try:/{p=0} p' out/gradle.log | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          (cd kafka && find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 \
            | tar -czf ../out/test-results.tgz --null -T -) || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-test-results
          path: |
            out/test-results.tgz
            out/gradle.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark failed
        if: steps.tests.outcome == 'failure'
        run: exit 1